<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log In</title>
<style>
  :root{
    --ink:#1c2321;
    --muted:#6b736f;
    --line:#d9ddd9;
    --accent:#3f6b52;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, #3f6b52 0%, #24402e 100%);
    padding:20px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:#fff;
    border-radius:8px;
    padding:38px 34px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .logo{
    width:42px;
    height:42px;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:18px;
    margin-bottom:18px;
  }
  h1{
    font-size:22px;
    margin:0 0 4px;
  }
  .lede{
    font-size:14px;
    color:var(--muted);
    margin:0 0 26px;
  }
  .field{margin-bottom:16px;}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
  }
  input[type="email"],
  input[type="password"]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:5px;
    font-size:14px;
    font-family:inherit;
    background:#fafbfa;
  }
  input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    background:#fff;
  }
  .row-between{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    margin-bottom:22px;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
  }
  .remember input{accent-color:var(--accent);}
  .row-between a{
    color:var(--accent);
    text-decoration:none;
  }
  button{
    width:100%;
    padding:12px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  button:hover{background:#345943;}
  .signup{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin-top:20px;
  }
  .signup a{
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">T</div>
    <h1>Welcome back</h1>
    <p class="lede">Log in to continue to your account.</p>

    <form action="#" method="post">
      <div class="field">
        <label for="login-email">Email address</label>
        <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required>
      </div>

      <div class="row-between">
        <span class="remember">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember" style="display:inline; font-weight:400; margin:0;">Remember me</label>
        </span>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Log in</button>
      <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
    </form>
  </main>
</body>
</html>
