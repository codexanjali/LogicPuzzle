<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create an Account</title>
<style>
  :root{
    --ink:#1c2321;
    --muted:#6b736f;
    --line:#d9ddd9;
    --accent:#3f6b52;
    --bg:#f2f4f1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:48px 20px;
  }
  .card{
    max-width:480px;
    margin:0 auto;
    background:#fff;
    border:1px solid var(--line);
    padding:38px 36px 32px;
  }
  h1{
    font-size:22px;
    margin:0 0 4px;
  }
  .lede{
    font-size:14px;
    color:var(--muted);
    margin:0 0 28px;
  }
  fieldset{
    border:none;
    padding:0;
    margin:0 0 20px;
  }
  .field{margin-bottom:18px;}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
  }
  input[type="text"],
  input[type="email"],
  input[type="password"],
  select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:#fafbfa;
  }
  input:focus, select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    background:#fff;
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    margin-top:5px;
  }
  legend{
    font-size:13px;
    font-weight:600;
    padding:0;
    margin-bottom:8px;
  }
  .choice-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    font-size:14px;
  }
  .choice-row input{
    width:16px;
    height:16px;
    accent-color:var(--accent);
  }
  .choice-row label{
    margin:0;
    font-weight:400;
  }
  .radio-group{
    display:flex;
    gap:20px;
  }
  button{
    width:100%;
    padding:12px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:4px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:8px;
  }
  button:hover{background:#345943;}
  .terms{
    font-size:12.5px;
    color:var(--muted);
    margin-top:14px;
    text-align:center;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Create an account</h1>
    <p class="lede">It takes less than a minute.</p>

    <form action="#" method="post">
      <div class="field">
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Your full name" required>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <p class="hint">Use at least 8 characters.</p>
      </div>

      <fieldset class="field">
        <legend>Gender</legend>
        <div class="radio-group">
          <div class="choice-row">
            <input type="radio" id="gender-female" name="gender" value="female">
            <label for="gender-female">Female</label>
          </div>
          <div class="choice-row">
            <input type="radio" id="gender-male" name="gender" value="male">
            <label for="gender-male">Male</label>
          </div>
          <div class="choice-row">
            <input type="radio" id="gender-other" name="gender" value="other">
            <label for="gender-other">Other</label>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">Select a country</option>
          <option value="in">India</option>
          <option value="us">United States</option>
          <option value="uk">United Kingdom</option>
          <option value="ca">Canada</option>
          <option value="other">Other</option>
        </select>
      </div>

      <fieldset class="field">
        <legend>Preferences</legend>
        <div class="choice-row">
          <input type="checkbox" id="newsletter" name="newsletter" value="yes">
          <label for="newsletter">Send me occasional updates</label>
        </div>
        <div class="choice-row">
          <input type="checkbox" id="terms" name="terms" value="agreed" required>
          <label for="terms">I agree to the Terms &amp; Conditions</label>
        </div>
      </fieldset>

      <button type="submit">Create account</button>
      <p class="terms">Already have an account? Log in instead.</p>
    </form>
  </main>
</body>
</html>
